# Copy to server.yaml and run: freelocker-server serve -config server.yaml
# Every key can be overridden by an env var: FREELOCKER_<UPPER_SNAKE_KEY>.
database_url: postgres://freelocker:change-me@localhost:5432/freelocker?sslmode=disable
agent_listen: ":8443"          # gRPC for agents (mTLS). Behind a load balancer this must be TLS passthrough.
console_listen: ":8080"        # REST API for the console
public_hostnames: [localhost]  # names/IPs agents use to reach agent_listen (go into the server cert)
master_secret_file: master.key # created on first run; back it up, keep it out of the database backup
console_tls_cert: ""           # optional PEM cert/key for the console; leave empty behind a TLS proxy
console_tls_key: ""
insecure_cookies: false        # true only for plain-HTTP access to a non-localhost address (testing)
# Let's Encrypt for the console (takes precedence over console_tls_cert).
# Needs the domain to resolve to this host and ports 443 (console_listen)
# and 80 (ACME HTTP-01 challenge) reachable from the internet.
acme_domains: []               # e.g. [console.example.com]
acme_email: ""                 # ACME account contact
acme_cache_dir: acme-cache     # where issued certificates are cached
release_dir: releases          # directory where agent releases are stored, one subdirectory per tenant id
release_base_url: ""           # URL agents download releases from (default: https://<first public hostname>:<console port>; http when the console has no TLS). Set it when the console sits behind a proxy or uses a self-signed cert.
metrics_retention_days: 30  # delete metrics/block-events/resolved-alerts older than this many days (0 disables)
approval_expiry_days: 30    # pending approval requests idle this long become expired (0 disables)
# Email notifications (SMTP). Only email channels need this; webhook
# channels work without it.
# Email channels cannot be created until host and from are both set.
# Security: a webhook channel URL is admin-supplied and fetched by the server
# with no host allowlist, and the response status is reported back to the
# admin, so a tenant admin can use it to probe internal hosts. Accepted risk;
# restrict outbound egress from the server if that matters to you.
# Each key can be overridden by env var: FREELOCKER_SMTP_<UPPER_SNAKE_KEY>.
# smtp:
#   host: smtp.example.com
#   port: 587
#   username: notifications@example.com
#   password: ""             # override with FREELOCKER_SMTP_PASSWORD
#   from: notifications@example.com
#   starttls: true
