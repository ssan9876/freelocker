# Separate project name so this never collides with docker-compose.yml
# (both files live in deploy/, which would otherwise be the shared default).
name: freelocker-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: freelocker
      POSTGRES_PASSWORD: freelocker
      POSTGRES_DB: freelocker
    ports:
      - "55432:5432"
