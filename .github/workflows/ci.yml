name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: freelocker
          POSTGRES_PASSWORD: freelocker
          POSTGRES_DB: freelocker
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U freelocker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      # The store/integration tests connect to the Postgres service above,
      # which storetest reaches at localhost:55432 by default.
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Cross-compile the Windows agent
        run: GOOS=windows GOARCH=amd64 go build ./cmd/agent ./cmd/agent-updater

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Type-check and build the console
        run: npm run build
        working-directory: web
