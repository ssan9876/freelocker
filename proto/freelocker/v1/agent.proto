syntax = "proto3";

package freelocker.v1;

option go_package = "freelocker/gen/freelocker/v1;flv1";

// Enrollment is called over server-authenticated TLS (no client cert yet).
service Enrollment {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

// Agent requires mTLS with a device certificate issued at enrollment.
service Agent {
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);
  rpc RenewCertificate(RenewRequest) returns (RenewResponse);
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
  rpc Observe(ObserveRequest) returns (Ack);
  rpc ReportBlocks(ReportBlocksRequest) returns (Ack);
  rpc ReportMetrics(MetricsRequest) returns (Ack);
  rpc GetControls(GetControlsRequest) returns (ControlsResponse);
  rpc ReportEvents(EventsRequest) returns (Ack);
  rpc GetRingfence(GetRingfenceRequest) returns (GetRingfenceResponse);
  rpc ReportRingfenceEvents(ReportRingfenceEventsRequest) returns (Ack);
}

message DeviceEvent {
  string kind = 1; // process_launch | logon
  string summary = 2;
  int64 at_unix = 3;
}

message EventsRequest {
  repeated DeviceEvent events = 1;
}

message GetControlsRequest {}

message ControlsResponse {
  bool usb_storage_blocked = 1;
  bool network_blocked = 2;
  bool elevation_blocked = 3;
}

message MetricsRequest {
  double cpu_pct = 1;
  double mem_pct = 2;
  double disk_pct = 3;
}

message Ack {}

message GetPolicyRequest {}

message GetPolicyResponse {
  string version = 1;
  string mode = 2; // "audit" or "enforce"
  bytes xml = 3;
  bytes signature = 4; // Ed25519 over the version string, update-signing key
}

// ObservedApp is a running/seen executable reported during learning mode.
message ObservedApp {
  string sha256 = 1;
  string path = 2;
  string signer = 3;
  string signer_tbs = 4;      // signing certificate TBS hash, "" when unsigned
  bool signer_verified = 5;   // Windows verified the signature
}

message ObserveRequest {
  repeated ObservedApp apps = 1;
}

message BlockEvent {
  string sha256 = 1;
  string path = 2;
  string signer = 3;
  bool blocked = 4; // true = enforced block, false = audit-only would-block
  int64 at_unix = 5;
  string signer_tbs = 6;
  bool signer_verified = 7;
}

message ReportBlocksRequest {
  repeated BlockEvent events = 1;
}

message HardwareInfo {
  string hostname = 1;
  string os_build = 2;
  string machine_guid = 3;
}

message EnrollRequest {
  string token_secret = 1; // secret part of the install token (before the ".")
  bytes csr_der = 2;
  HardwareInfo hardware = 3;
}

message EnrollResponse {
  string device_id = 1;
  bytes cert_der = 2;
  bytes ca_cert_der = 3;
  bytes command_signing_public_key = 4;
  bytes update_signing_public_key = 5;
  bytes uninstall_code_sha256 = 6;
}

message Inventory {
  string hostname = 1;
  string os_build = 2;
  repeated string ip_addresses = 3;
  string logged_on_user = 4;
  string agent_version = 5;
  int64 uptime_seconds = 6;
  string policy_version = 7; // the WDAC policy version the agent has applied
}

message Heartbeat {
  Inventory inventory = 1;
  int64 sent_at_unix = 2;
}

message CommandResult {
  string command_id = 1;
  bool success = 2;
  string message = 3;
}

// Goodbye is sent on clean service shutdown so the server can tell
// "stopped normally" from "went silent".
message Goodbye {
  string reason = 1;
}

message AgentMessage {
  oneof body {
    Heartbeat heartbeat = 1;
    CommandResult command_result = 2;
    Goodbye goodbye = 3;
  }
}

enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  COMMAND_TYPE_PING = 1;
  COMMAND_TYPE_REFRESH_INVENTORY = 2;
  COMMAND_TYPE_ROTATE_CERTIFICATE = 3;
  COMMAND_TYPE_UNINSTALL = 4;
  COMMAND_TYPE_UPDATE_AGENT = 5;
}

message Command {
  string id = 1;
  CommandType type = 2;
  string device_id = 3;
  int64 issued_at_unix = 4;
  int64 expires_at_unix = 5;
  bytes payload = 6;
}

// command is the deterministic serialization of Command; signature is
// Ed25519 over those exact bytes.
message SignedCommand {
  bytes command = 1;
  bytes signature = 2;
}

message ServerMessage {
  oneof body {
    SignedCommand command = 1;
  }
}

message RenewRequest {
  bytes csr_der = 1;
}

message RenewResponse {
  bytes cert_der = 1;
}

message GetRingfenceRequest {}

message RingfenceProgram {
  string path = 1;
  bool network_blocked = 2;
}

message RingfenceProtection {
  string asr_rule = 1; // ASR GUID
  string action = 2;   // audit | block
}

message GetRingfenceResponse {
  string version = 1; // content hash; empty means no ringfence assigned
  string mode = 2;    // audit | enforce
  repeated RingfenceProgram programs = 3;
  repeated RingfenceProtection protections = 4;
}

message RingfenceEvent {
  string kind = 1;    // network | child_process
  string program = 2;
  string detail = 3;
  bool enforced = 4;  // false = would have blocked (audit)
  int64 at_unix = 5;
}

message ReportRingfenceEventsRequest {
  repeated RingfenceEvent events = 1;
  // Whether Defender/ASR was active on the device when this report was
  // generated. ASR-based protections (e.g. block-office-child-process) are
  // inert if Defender is not the active anti-virus, so the console needs
  // this to avoid showing a false green tick.
  bool asr_available = 2;
}
